name: Portfolio CI/CD

on:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Verify frontend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: portfolio-checks-main
      cancel-in-progress: true
    env:
      VITE_CONTENT_SOURCE: sanity
      VITE_RESEARCH_SOURCE: sanity
      VITE_PUBLICATIONS_SOURCE: sanity
      VITE_TYPEFACES_SOURCE: sanity
      VITE_ABOUT_SOURCE: sanity
      VITE_CMS_MOCK_TESTS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked frontend dependencies
        run: npm ci --ignore-scripts
      - name: Install browser engines
        run: npx --no-install playwright install --with-deps chromium firefox webkit
      - name: ESLint
        run: npm run lint
      - name: Offline maintenance and release guard tests
        run: node --test migration/tests/*.test.js .github/scripts/release.test.js
      - name: Build CMS frontend once
        run: npm run build
      - name: Local-content browser matrix
        run: npm run test:e2e
      - name: CMS component tests
        run: npm run test:cms -- --workers=2
      - name: SDK transport tests
        run: npm run test:sanity
      - name: CMS mobile WebKit tests
        run: npx --no-install playwright test --config=playwright.cms.webkit.config.js --workers=2
      - name: Test the production CMS build
        run: npx --no-install playwright test --config=playwright.release.config.js
      - name: Package verified static build
        run: |
          node .github/scripts/release.js package
          tar -czf "$RUNNER_TEMP/portfolio-release.tgz" .vercel/output .vercel/release.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portfolio-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/portfolio-release.tgz
          if-no-files-found: error
          retention-days: 2
      - name: Preserve browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Stage and promote verified build
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    # Keep releases serial; cancelling a CLI cannot revoke an accepted API request.
    concurrency:
      group: portfolio-production
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TELEMETRY_DISABLED: '1'
      VERCEL_CLI_VERSION: 65.14.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Reject superseded commit and missing credentials
        run: node .github/scripts/release.js preflight
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: portfolio-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release
      - name: Verify release artifact and create isolated project link
        run: |
          tar -xzf "$RUNNER_TEMP/release/portfolio-release.tgz"
          node .github/scripts/release.js verify
          node .github/scripts/release.js link
      - name: Install pinned deployment CLI
        run: npm install --global "vercel@$VERCEL_CLI_VERSION" --ignore-scripts --no-audit --no-fund
      - name: Find a previous deployment of this exact artifact
        run: |
          vercel list --environment=production --json \
            --meta "portfolioRepository=$GITHUB_REPOSITORY" \
            --meta "githubCommitSha=$GITHUB_SHA" \
            --token "$VERCEL_TOKEN" > "$RUNNER_TEMP/deployments.json"
          node .github/scripts/release.js select "$RUNNER_TEMP/deployments.json"
      - name: Stage production build without assigning domains
        run: |
          node .github/scripts/release.js preflight
          if [ ! -f .vercel/deployment.json ]; then
            deployment_url=$(vercel deploy --prebuilt --prod --skip-domain --yes \
              --meta "portfolioRepository=$GITHUB_REPOSITORY" \
              --meta "githubCommitSha=$GITHUB_SHA" \
              --meta "githubCommitRef=main" \
              --meta "portfolioBuild=$(node .github/scripts/release.js digest)" \
              --token "$VERCEL_TOKEN")
            node .github/scripts/release.js record "$deployment_url"
          fi
      - name: Check staged HTML, assets and licenses against verified hashes
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node .github/scripts/release.js smoke
      - name: Check whether this deployment is already current
        id: current
        run: node .github/scripts/release.js current
      - name: Reject superseded commit immediately before promotion
        run: node .github/scripts/release.js preflight
      - name: Assign production domains to the tested deployment
        if: steps.current.outputs.current != 'true'
        run: |
          vercel promote "$(node .github/scripts/release.js url)" \
            --timeout=5m --token "$VERCEL_TOKEN"
      - name: Verify production target and report release
        run: node .github/scripts/release.js confirm
